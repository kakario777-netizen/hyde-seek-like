name: Android APK 빌드

on:
  push:
    branches: [main]
    paths-ignore: ['assets_src/**', 'tools/fetch_*.py', '.github/workflows/fetch-assets.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 고도 엔진과 내보내기 템플릿 받기
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: 안드로이드 SDK 설정 (서명 키는 저장소의 고정 키 사용)
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-${GODOT_VERSION}.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            } > ~/.config/godot/$f
          done

      - name: 버전 번호 자동 증가 (빌드마다 커져야 업데이트 설치 가능)
        run: sed -i "s/^version\/code=.*/version\/code=$((100 + ${{ github.run_number }}))/" export_presets.cfg

      - name: APK 내보내기 (항상 같은 키로 서명 → 덮어쓰기 설치 가능)
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/signing/hanyang.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: hanyang
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: REMOVED
        run: |
          mkdir -p build
          timeout 300 ~/godot/godot --headless --editor --quit || true
          ~/godot/godot --headless --export-release "Android" build/hanyang-hide.apk
          ls -la build
          $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)/apksigner verify --print-certs build/hanyang-hide.apk | head -3

      - name: 버전 번호 확인 (설치된 앱보다 커야 업데이트됨)
        run: grep -E "version/(code|name)" export_presets.cfg

      - name: 릴리스에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 빌드 ${{ github.run_number }}
          body: 한양 숨바꼭질 자동 빌드 (${{ github.sha }})
          files: build/hanyang-hide.apk

name: Android APK 빌드

on:
  push:
    branches: [main]
    paths-ignore: ['assets_src/**', 'tools/fetch_assets.py', '.github/workflows/fetch-assets.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 고도 엔진과 내보내기 템플릿 받기
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: 서명 키와 안드로이드 SDK 설정
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-${GODOT_VERSION}.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-4.tres

      - name: APK 내보내기
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          timeout 300 ~/godot/godot --headless --editor --quit || true
          ~/godot/godot --headless --export-debug "Android" build/hanyang-hide.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: hanyang-hide-apk
          path: build/hanyang-hide.apk

      - name: 릴리스에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 빌드 ${{ github.run_number }}
          body: 한양 숨바꼭질 자동 빌드 (${{ github.sha }})
          files: build/hanyang-hide.apk

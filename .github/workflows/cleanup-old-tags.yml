name: 옛 태그·릴리스 정리 (서명 키가 남은 옛 기록 지우기)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 옛 릴리스와 태그 삭제 (앱 업데이트는 hyde-seek-releases에서 받으므로 영향 없음)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release list -R "$REPO" -L 1000 --json tagName -q '.[].tagName' | while read t; do
            gh release delete "$t" -R "$REPO" -y --cleanup-tag || true
          done
          gh api "repos/$REPO/git/matching-refs/tags/" -q '.[].ref' | while read r; do
            gh api -X DELETE "repos/$REPO/git/$r" || true
          done
          echo "남은 태그: $(gh api repos/$REPO/git/matching-refs/tags/ -q 'length')"
